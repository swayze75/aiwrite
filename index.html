<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리 반 AI 마법 소설집 🪄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #2D1B4E; color: white; min-height: 100vh; margin: 0; }
        .parchment { background: #fdf5e6; border: 20px solid #5C4033; color: #333; }
        .ai-twist { background: rgba(255, 215, 0, 0.2); border-left: 5px solid #FFD700; font-weight: bold; }
        .magic-glow { text-shadow: 0 0 10px #FFD700; animation: glow 2s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 10px #fff; } to { text-shadow: 0 0 20px #FFD700; } }
    </style>
</head>
<body class="p-5 flex flex-col items-center">

    <div class="w-full max-w-3xl flex justify-between items-center mb-5">
        <h1 class="text-4xl font-bold text-yellow-400 magic-glow">🪄 마법 소설집</h1>
        <div class="flex items-center gap-3">
            <div id="aiStatus" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-500">Checking...</div>
            <button onclick="openSettings()" class="bg-purple-700 p-2 px-4 rounded border border-purple-400">⚙️ 설정</button>
        </div>
    </div>

    <div id="storyBoard" class="parchment w-full max-w-3xl min-h-[400px] max-h-[60vh] overflow-y-auto p-6 rounded-lg mb-5 text-xl shadow-2xl">
        <div id="storyContent" class="space-y-4"></div>
        <div id="loading" class="hidden text-center py-4 text-purple-700 animate-bounce font-bold">✨ Gemini 3.1 AI가 이야기를 짓는 중...</div>
    </div>

    <div class="w-full max-w-3xl bg-purple-900 p-5 rounded-2xl border-2 border-yellow-500 shadow-xl">
        <div class="flex gap-3">
            <input type="text" id="userText" onkeypress="if(event.key==='Enter') addStory()" placeholder="이야기를 이어 써주세요..." class="flex-1 p-3 rounded-xl text-lg bg-white text-purple-900 outline-none">
            <button onclick="addStory()" class="bg-yellow-500 text-purple-900 font-bold py-3 px-6 rounded-xl text-lg whitespace-nowrap">✨ 추가</button>
        </div>
        <div class="mt-4 flex justify-between text-sm">
            <button onclick="resetStory()" class="text-red-300 underline">📖 처음부터 다시</button>
            <button onclick="saveToFile()" class="text-yellow-300 underline font-bold">💾 저장하기</button>
        </div>
    </div>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full text-purple-900 border-4 border-yellow-500">
            <h2 class="text-2xl font-bold mb-3">⚙️ 마법 설정</h2>
            <p class="text-xs mb-3 text-gray-600">* Gemini API Key를 입력하세요. (AIza...)</p>
            <input type="password" id="apiKey" placeholder="AIza..." class="w-full p-3 rounded-xl mb-4 border-2 border-gray-300 outline-none">
            <div class="flex justify-end gap-2">
                <button onclick="closeSettings()" class="px-4 py-2 rounded-lg bg-gray-200">취소</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-purple-600 text-white font-bold">저장</button>
            </div>
        </div>
    </div>

    <script>
        var story = [];
        var apiKey = '';

        function start() {
            try {
                var s = localStorage.getItem('magicStory');
                if (s) story = JSON.parse(s);
                var k = localStorage.getItem('magicApiKey');
                if (k) apiKey = k;
                updateStatus();
                render();
                var input = document.getElementById('apiKey');
                if (input) input.value = apiKey;
            } catch (e) { console.error('Init error:', e); }
        }

        function updateStatus() {
            var el = document.getElementById('aiStatus');
            if (!el) return;
            if (apiKey && apiKey.trim().startsWith('AIza')) {
                el.innerText = '🟢 Gemini 3.1 모드 활성';
                el.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-500 text-white';
            } else {
                el.innerText = '🟡 API 키 필요';
                el.className = 'px-3 py-1 rounded-full text-xs font-bold bg-yellow-500 text-purple-900';
            }
        }

        function render() {
            var content = document.getElementById('storyContent');
            if (!content) return;
            content.innerHTML = '';
            for (var i = 0; i < story.length; i++) {
                var item = story[i];
                var div = document.createElement('div');
                div.className = 'p-3 rounded-lg ' + (item.isAI ? 'ai-twist' : '');
                div.innerHTML = item.isAI ? '✨ ' + item.text : '[ 작가 ]: ' + item.text;
                content.appendChild(div);
            }
            var board = document.getElementById('storyBoard');
            if (board) board.scrollTop = board.scrollHeight;
        }

        function addStory() {
            var input = document.getElementById('userText');
            var text = input.value.trim();
            if (!text) return alert('내용을 입력하세요!');
            story.push({ user: '작가', text: text, isAI: false });
            save();
            input.value = '';
            render();
            triggerAI();
        }

        async function triggerAI() {
            var loading = document.getElementById('loading');
            if (loading) loading.classList.remove('hidden');
            render();

            if (!apiKey || !apiKey.trim().startsWith('AIza')) {
                alert('설정에서 Gemini API 키를 입력해주세요.');
                if (loading) loading.classList.add('hidden');
                return;
            }

            var modelsToTry = [
                { version: 'v1', model: 'gemini-3.1-flash' },
                { version: 'v1beta', model: 'gemini-3.1-flash' },
                { version: 'v1', model: 'gemini-3.1-pro' },
                { version: 'v1beta', model: 'gemini-3.1-pro' },
                { version: 'v1', model: 'gemini-3.8-flash' },
                { version: 'v1', model: 'gemini-1.5-flash' }
            ];

            var success = false;
            var finalResult = '';

            for (var i = 0; i < modelsToTry.length; i++) {
                var m = modelsToTry[i];
                try {
                    var url = 'https://generativelanguage.googleapis.com/' + m.version + '/models/' + m.model + ':generateContent?key=' + apiKey;
                    var res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: '너는 초등학생 릴레이 소설의 전문 작가이자 마법사야. 지금까지의 내용을 읽고, 이야기의 흐름을 유지하면서도 아주 창의적인 전개를 담은 다음 문장을 딱 한 문장으로 이어 써줘. 한국어로 답변하고 반드시 이야기의 내용만 출력해줘. \n\n내용: ' + story.map(function(s){return s.text}).join(' ') }] }]
                        })
                    });
                    
                    if (res.ok) {
                        var data = await res.json();
                        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
                            finalResult = data.candidates[0].content.parts[0].text;
                            success = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.log('Model ' + m.model + ' failed: ' + e);
                }
            }

            if (success) {
                story.push({ user: 'AI', text: finalResult, isAI: true });
            } else {
                story.push({ user: 'AI', text: '❌ [마법 오류]: AI 모델 연결에 실패했습니다.', isAI: true });
            }

            save();
            if (loading) loading.classList.add('hidden');
            render();
        }

        function save() {
            try { localStorage.setItem('magicStory', JSON.stringify(story)); } catch (e) {}
        }

        function resetStory() {
            if (confirm('초기화할까요?')) {
                story = [];
                localStorage.removeItem('magicStory');
                render();
            }
        }

        function saveToFile() {
            var text = '🪄 마법 소설집\n\n';
            for (var i = 0; i < story.length; i++) {
                var item = story[i];
                text += (item.isAI ? '✨ ' : '[ 작가 ]: ') + item.text + '\n';
            }
            var blob = new Blob([text], { type: 'text/plain' });
            var a = document.createElement('a');
            a.download = 'story.txt';
            a.href = URL.createObjectURL(blob);
            a.click();
        }

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            var key = document.getElementById('apiKey').value;
            localStorage.setItem('magicApiKey', key);
            apiKey = key;
            updateStatus();
            closeSettings();
            alert('저장됨');
        }

        start();
    </script>
</body>
</html>
